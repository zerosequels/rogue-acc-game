<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rogue/acc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #04060b;
        --panel: rgba(8, 14, 26, 0.82);
        --line: #16243d;
        --fg: #c8d6ee;
        --dim: #5a6e92;
        --cyan: #35e4ff;
        --magenta: #ff3cc8;
        --amber: #ffb340;
        --lime: #9dff4a;
        --red: #ff4d5e;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--fg);
        font-family: var(--mono); font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* ---------- shared chrome ---------- */
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        backdrop-filter: blur(6px);
      }
      .label { color: var(--dim); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
      .mono-num { font-variant-numeric: tabular-nums; font-weight: 800; }

      /* ---------- HUD ---------- */
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

      #hud-top {
        position: absolute; top: 0; left: 0; right: 0;
        display: flex; align-items: stretch; gap: 1px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .hud-cell { padding: 8px 14px; min-width: 0; }
      .hud-cell + .hud-cell { border-left: 1px solid var(--line); }
      .hud-cell .val { font-size: 19px; line-height: 1.15; }
      #hud-spacer { flex: 1; border-left: 1px solid var(--line); }

      #cell-bench { flex: 0 0 auto; min-width: 290px; }
      #bench-bar {
        position: relative; height: 7px; margin-top: 7px;
        background: #0b1424; border: 1px solid var(--line); overflow: hidden;
      }
      #bench-fill {
        position: absolute; inset: 0 100% 0 0;
        background: linear-gradient(90deg, var(--cyan), var(--lime));
        transition: right .22s cubic-bezier(.2,.8,.2,1);
      }
      #bench-bar.met #bench-fill { background: linear-gradient(90deg, var(--lime), var(--amber)); }
      #bench-name { color: var(--cyan); font-size: 10px; letter-spacing: .1em; margin-top: 5px; }

      .act-pips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; max-width: 230px; }
      .pip { width: 6px; height: 11px; background: var(--cyan); opacity: .9; }
      .pip.spent { background: #1d2a40; }
      #cell-act.low .val { color: var(--red); }
      #cell-act.low .pip:not(.spent) { background: var(--red); }

      /* ---------- deck rail ---------- */
      #deck-rail {
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; gap: 6px; width: 234px;
      }
      .card-row {
        display: grid; grid-template-columns: 16px 1fr; gap: 9px; align-items: center;
        padding: 8px 12px; background: var(--panel); border: 1px solid var(--line);
        opacity: .55;
      }
      .card-row.now { opacity: 1; transform: translateX(8px); }
      .card-row .marker { color: var(--dim); font-size: 11px; text-align: center; }
      .card-row.now .marker { color: var(--lime); }
      .card-row .cname { font-size: 12px; font-weight: 600; }
      .card-row .cmeta { font-size: 10px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
      .card-row[data-type="common-crawl"].now { border-color: var(--cyan); }
      .card-row[data-type="arxiv"].now       { border-color: var(--amber); }
      .card-row[data-type="synthetic"].now   { border-color: var(--magenta); }
      .card-row[data-type="rlhf"].now        { border-color: var(--lime); }
      .deck-foot {
        font-size: 10px; color: var(--dim); letter-spacing: .1em;
        text-transform: uppercase; margin-top: 3px; padding-left: 2px;
      }

      /* ---------- boss bar ---------- */
      #boss-bar {
        display: none; align-items: baseline; gap: 14px;
        padding: 9px 18px; background: rgba(40, 6, 16, .92);
        border-bottom: 1px solid #55202f;
      }
      #boss-bar.on { display: flex; }
      #boss-bar b {
        color: var(--red); font-size: 12px; font-weight: 800;
        letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
      }
      #boss-bar span { font-size: 12px; color: #d6a8b4; }

      /* ---------- launch readout ---------- */
      .hud-cell.readout { min-width: 96px; text-align: right; }
      #chain-val { color: var(--amber); }
      #mult-val { color: var(--magenta); }

      #charge-wrap {
        position: absolute; bottom: 0; left: 0; right: 0;
        height: 4px; background: #0b1424; overflow: hidden;
        opacity: 0; transition: opacity .1s;
      }
      #charge-wrap.on { opacity: 1; }
      #charge-fill {
        position: absolute; inset: 0 100% 0 0;
        background: linear-gradient(90deg, var(--cyan), var(--amber), var(--magenta));
      }

      /* ---------- diegetic telemetry ---------- */
      /* Readouts that live ON the board rather than in a HUD panel. The
         reference art scatters coordinate locks across the subject; it is
         what makes a render read as an instrument tracking something. */
      #telemetry { position: absolute; inset: 0; overflow: hidden; }
      .tele {
        position: absolute;
        font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
        color: var(--dim); white-space: nowrap; pointer-events: none;
        text-transform: uppercase;
      }
      .tele::before {
        content: ""; position: absolute; left: -9px; top: 50%;
        width: 6px; height: 1px; background: currentColor; opacity: .7;
      }
      .tele.track { color: #7fd6ff; }
      .tele.lock  { color: var(--amber); }
      .tele.fade  { animation: teleOut 1.1s ease-out forwards; }
      @keyframes teleOut {
        0%   { opacity: 0; transform: translateX(-4px); }
        14%  { opacity: 1; transform: none; }
        100% { opacity: 0; }
      }

      /* ---------- floating score popups ---------- */
      #popups { position: absolute; inset: 0; overflow: hidden; }
      .popup {
        position: absolute; font-size: 13px; font-weight: 800;
        text-shadow: 0 0 10px currentColor; white-space: nowrap;
        animation: floatUp 900ms cubic-bezier(.17,.84,.44,1) forwards;
      }
      .popup.crit { font-size: 17px; }
      @keyframes floatUp {
        0%   { opacity: 0; transform: translate(-50%, 0) scale(.72); }
        18%  { opacity: 1; transform: translate(-50%, -8px) scale(1.12); }
        100% { opacity: 0; transform: translate(-50%, -52px) scale(.94); }
      }

      /* ---------- instrument surface ----------
         Grain + scanlines applied to the DOM layers so the shop and the
         sheets share the board's materiality. The noise is an inline SVG
         data URI, so the bundle stays asset-free. */
      :root {
        --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
      }
      .surfaced { position: relative; }
      .surfaced::before,
      .surfaced::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
      }
      .surfaced::before {
        background-image: var(--grain);
        opacity: .07; mix-blend-mode: overlay;
      }
      .surfaced::after {
        background: repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.028) 0px,
          rgba(255,255,255,.028) 1px,
          transparent 1px,
          transparent 3px
        );
        opacity: .8;
      }

      /* Corner brackets: the cheapest "this is an instrument" cue, reused
         from the board chrome so the two layers rhyme. */
      .bracketed { position: relative; }
      .bracketed > .bk {
        position: absolute; width: 11px; height: 11px;
        border-color: var(--bkcol, var(--wire)); pointer-events: none;
      }
      .bracketed > .bk.tl { top: -1px; left: -1px;  border-top: 1px solid; border-left: 1px solid; }
      .bracketed > .bk.tr { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
      .bracketed > .bk.bl { bottom: -1px; left: -1px;  border-bottom: 1px solid; border-left: 1px solid; }
      .bracketed > .bk.br { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

      /* Spectral fringe on display type — the dispersion the post chain does
         to bright things on the board, applied to the loudest text. */
      .fringe {
        text-shadow:
          -0.6px 0 0 rgba(255, 60, 200, .45),
           0.6px 0 0 rgba(63, 224, 255, .45);
      }

      /* ---------- overlays ---------- */
      #overlay {
        position: fixed; inset: 0; z-index: 30;
        display: none; align-items: center; justify-content: center;
        background: rgba(2, 4, 9, .86); backdrop-filter: blur(3px);
      }
      #overlay.on { display: flex; }
      .sheet { width: min(940px, 94vw); max-height: 92vh; overflow-y: auto; padding: 30px 34px; }
      .sheet h1 { margin: 0 0 4px; font-size: 27px; letter-spacing: -.02em; font-weight: 800; }
      .sheet h2 { margin: 0 0 18px; font-size: 12px; font-weight: 400; color: var(--dim); letter-spacing: .1em; }
      .flavor {
        margin: 16px 0 22px; padding: 13px 16px;
        border-left: 2px solid var(--cyan); background: rgba(53, 228, 255, .05);
        color: #9fb6d8; font-size: 12.5px; line-height: 1.65;
      }
      .ok { color: var(--lime); } .bad { color: var(--red); }
      .cyan { color: var(--cyan); } .mag { color: var(--magenta); } .amb { color: var(--amber); }

      .stat-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 22px;
      }
      .stat { background: #070d18; padding: 11px 14px; }
      .stat .val { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

      /* ---------- upgrade cards ---------- */
      #cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; margin-top: 4px; }
      .card {
        padding: 16px; cursor: pointer; text-align: left;
        background: #070d18; border: 1px solid var(--line);
        transition: transform .14s cubic-bezier(.2,.8,.2,1), border-color .14s, background .14s;
        display: flex; flex-direction: column; min-height: 196px;
      }
      .card:hover, .card.kb {
        transform: translateY(-5px); background: #0b1526;
        border-color: var(--pick, var(--cyan));
      }
      .card .arch {
        font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
        color: var(--pick, var(--cyan)); margin-bottom: 9px; font-weight: 600;
      }
      .card .cname { font-size: 16px; font-weight: 800; margin-bottom: 9px; line-height: 1.25; }
      .card .cdesc { font-size: 12px; color: #91a6c6; line-height: 1.6; flex: 1; }
      .card .ckey {
        margin-top: 13px; font-size: 10px; color: var(--dim);
        border-top: 1px solid var(--line); padding-top: 9px;
      }
      .card[data-arch="scale"]       { --pick: var(--cyan); }
      .card[data-arch="width"]       { --pick: var(--lime); }
      .card[data-arch="precision"]   { --pick: var(--amber); }
      .card[data-arch="temperature"] { --pick: var(--magenta); }

      .btn {
        display: inline-block; margin-top: 22px; padding: 11px 26px;
        background: transparent; color: var(--cyan);
        border: 1px solid var(--cyan); cursor: pointer;
        font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .1em;
        transition: background .14s, color .14s;
      }
      .btn:hover { background: var(--cyan); color: var(--bg); }
      .btn.danger { color: var(--red); border-color: var(--red); }
      .btn.danger:hover { background: var(--red); color: #140306; }

      .mods-list { margin-top: 20px; font-size: 11.5px; color: var(--dim); line-height: 1.9; }
      .mods-list b { color: var(--fg); font-weight: 600; }

      /* ---------- seed / footer ---------- */
      #seed-bar {
        position: absolute; bottom: 8px; right: 12px;
        font-size: 10px; color: var(--dim); pointer-events: auto;
        display: flex; gap: 14px; align-items: center;
      }
      #seed-bar code { color: #7f93b5; }
      #seed-bar button {
        background: none; border: 1px solid var(--line); color: var(--dim);
        font-family: var(--mono); font-size: 9px; padding: 3px 7px; cursor: pointer;
      }
      #seed-bar button:hover { color: var(--cyan); border-color: var(--cyan); }
      #mute-btn.off { color: var(--red); border-color: #3a2030; }

      #help-hint {
        position: absolute; bottom: 10px; left: 18px; max-width: 330px;
        font-size: 10px; color: var(--dim); line-height: 1.75;
      }
      kbd {
        border: 1px solid var(--line); padding: 0 4px; border-radius: 2px;
        color: #8ba0c0; font-size: 9px;
      }

      /* ---------- shop ---------- */
      .wallet {
        display: flex; align-items: baseline; gap: 14px;
        margin: 6px 0 20px; flex-wrap: wrap;
      }
      .wallet .cash {
        font-family: var(--mono); font-size: 30px; font-weight: 800;
        color: var(--magenta); font-variant-numeric: tabular-nums;
      }
      .wallet .cashnote { font-size: 11px; color: var(--dim); }

      #shop-grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px; margin-bottom: 20px;
      }
      .shop-card {
        display: flex; flex-direction: column; min-height: 188px;
        padding: 15px; background: #070d18; border: 1px solid var(--line);
        cursor: pointer; text-align: left;
        transition: transform .14s cubic-bezier(.2,.8,.2,1), border-color .14s, background .14s;
      }
      .shop-card:hover { transform: translateY(-4px); background: #0b1526; border-color: var(--pick, var(--cyan)); }
      .shop-card.poor { opacity: .42; cursor: not-allowed; }
      .shop-card.poor:hover { transform: none; border-color: var(--line); }
      .shop-card.sold { opacity: .3; }
      .shop-card[data-prec="blind"]   { --pick: var(--dim);   --bkcol: #2a3a52; }
      .shop-card[data-prec="banded"]  { --pick: var(--cyan);  --bkcol: #1d4b5e; }
      .shop-card[data-prec="precise"] { --pick: var(--amber); --bkcol: #553f12; }
      .shop-card:hover > .bk { border-color: var(--pick); }
      .shop-card .prec { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .shop-card .prec-tag {
        font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
        color: var(--pick); border: 1px solid currentColor; padding: 1px 5px; font-weight: 700;
      }
      .shop-card .prec-note { font-size: 9.5px; color: var(--dim); }
      .shop-card .cname { font-size: 15px; font-weight: 800; margin-bottom: 7px; line-height: 1.25; }
      .shop-card .cdesc { font-size: 12px; color: #91a6c6; line-height: 1.5; }
      .shop-card .cflavor { font-size: 11px; color: var(--dim); font-style: italic; margin-top: 7px; flex: 1; }
      .shop-card .slug {
        font-family: var(--mono); font-size: 8.5px; letter-spacing: .14em;
        color: var(--dim); opacity: .65; margin-bottom: 8px;
      }
      .shop-card .cfoot {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px;
      }
      .shop-card .price {
        font-family: var(--mono); font-size: 17px; font-weight: 800; color: var(--magenta);
      }
      .shop-card .ckey { font-size: 10px; color: var(--dim); }

      .shop-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
      .btn.off { opacity: .35; cursor: not-allowed; }
      .shop-msg {
        padding: 9px 14px; margin-bottom: 16px; font-size: 12.5px;
        border-left: 2px solid var(--lime); background: rgba(157,255,74,.06);
      }
      .shop-msg.bad { border-left-color: var(--red); background: rgba(255,77,94,.06); color: #e0a8b0; }

      .target-list {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 1px; background: var(--line); border: 1px solid var(--line);
        max-height: 54vh; overflow-y: auto;
      }
      .target-row {
        display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center;
        background: #070d18; border: none; padding: 10px 13px; cursor: pointer;
        font-family: var(--mono); font-size: 12px; color: var(--fg); text-align: left;
      }
      .target-row:hover { background: #122238; color: var(--cyan); }
      .target-row .tid { color: var(--amber); font-weight: 700; }
      .target-row .ttag { color: var(--dim); font-size: 10px; }

      .deck-strip { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
      .deck-cards { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
      .mini-card {
        font-family: var(--mono); font-size: 10px; padding: 3px 7px;
        border: 1px solid var(--line); color: var(--dim);
      }
      .mini-card[data-type="common-crawl"] { color: var(--cyan);    border-color: #16384a; }
      .mini-card[data-type="arxiv"]        { color: var(--amber);   border-color: #45350f; }
      .mini-card[data-type="synthetic"]    { color: var(--magenta); border-color: #4a1538; }
      .mini-card[data-type="rlhf"]         { color: var(--lime);    border-color: #2c4420; }

      .score-line { font-size: 15px; margin-bottom: 14px; color: #a9bcd6; }
      .boss-call {
        border: 1px solid #55202f; background: rgba(40,6,16,.6);
        padding: 15px 18px; margin: 16px 0 22px;
      }
      .boss-call .boss-name {
        color: var(--red); font-size: 13px; font-weight: 800;
        letter-spacing: .16em; text-transform: uppercase; margin-bottom: 7px;
      }
      .boss-call .boss-desc { font-size: 13.5px; color: #d6b2bb; line-height: 1.6; }
      .dimv { color: var(--dim); }
      .lime { color: var(--lime); }
      .popup.sig { font-size: 11px; font-weight: 600; }

      #boot {
        position: fixed; inset: 0; z-index: 40; background: var(--bg);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px;
      }
      #boot .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
      #boot .big i { color: var(--magenta); font-style: normal; }
      #boot .sub { font-size: 11px; color: var(--dim); letter-spacing: .14em; }
      .glitch-text { animation: gl 2.4s infinite steps(1); }
      @keyframes gl {
        0%, 92%, 100% { text-shadow: none; transform: none; }
        93% { text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan); transform: translateX(1px); }
        96% { text-shadow: 2px 0 var(--magenta), -2px 0 var(--cyan); transform: translateX(-1px); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="hud-top">
        <div class="hud-cell" id="cell-round">
          <div class="label">Funding round</div>
          <div class="val mono-num" id="round-val">Pre-Seed</div>
          <div class="label" id="round-name" style="margin-top:5px">1 / 24</div>
        </div>
        <div class="hud-cell" id="cell-bench">
          <div class="label">Benchmark</div>
          <div class="val mono-num"><span id="score-val">0</span><span style="color:var(--dim);font-weight:400;font-size:14px"> / <span id="target-val">900</span></span></div>
          <div id="bench-bar"><div id="bench-fill"></div></div>
          <div id="bench-name">—</div>
        </div>
        <div class="hud-cell" id="cell-act">
          <div class="label">Activations</div>
          <div class="val mono-num"><span id="act-val">10</span><span style="color:var(--dim);font-weight:400;font-size:14px"> / <span id="act-max">10</span></span></div>
          <div class="act-pips" id="act-pips"></div>
        </div>
        <div class="hud-cell" id="cell-money">
          <div class="label">Capital</div>
          <div class="val mono-num" id="money-val">$4</div>
          <div class="label" style="margin-top:5px">1 = $1B</div>
        </div>
        <div id="hud-spacer"></div>
        <div class="hud-cell readout">
          <div class="label">Chain</div>
          <div class="val mono-num" id="chain-val">0</div>
        </div>
        <div class="hud-cell readout">
          <div class="label">Tier</div>
          <div class="val mono-num" id="mult-val">×1.0</div>
        </div>
        <div class="hud-cell readout">
          <div class="label">Signal</div>
          <div class="val mono-num" id="signal-val">0</div>
        </div>
        <div class="hud-cell readout">
          <div class="label">Pass</div>
          <div class="val mono-num" id="launch-val">0</div>
        </div>
      </div>

      <div id="boss-bar"></div>

      <div id="deck-rail"></div>

      <div id="charge-wrap"><div id="charge-fill"></div></div>

      <div id="popups"></div>
      <div id="telemetry"></div>

      <div id="help-hint">
        <kbd>◄ ►</kbd> / mouse &nbsp;aim &nbsp;·&nbsp; <kbd>SPACE</kbd> / click &nbsp;charge + fire<br />
        <kbd>E</kbd> &nbsp;agentic override &nbsp;·&nbsp; <kbd>M</kbd> &nbsp;mute &nbsp;·&nbsp; <kbd>R</kbd> &nbsp;new run
      </div>

      <div id="seed-bar">
        <button id="mute-btn" title="Toggle audio (M)">♪ on</button>
        <span>seed <code id="seed-txt">—</code></span>
        <button id="seed-copy">copy link</button>
        <button id="seed-new">reroll</button>
      </div>
    </div>
